<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tab Grouper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-title">
        <div class="logo-icon">🗂️</div>
        <div>
          <h1>Smart Tab Grouper</h1>
          <p class="subtitle">ドメイン最優先 ＆ 誤検知防止モデル</p>
        </div>
      </div>
      <button id="btnOptions" class="icon-button" title="設定画面を開く">
        ⚙️
      </button>
    </header>

    <!-- Mode Toggles Container -->
    <div class="toggles-grid">
      <!-- Realtime Auto-Group Toggle -->
      <div class="toggle-card">
        <div class="toggle-label">
          <span class="toggle-title">⚡ リアルタイム自動分け</span>
          <span class="toggle-desc">タブ移動時に自動グループ化</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chkAutoGroup">
          <span class="slider round"></span>
        </label>
      </div>

      <!-- Preview Dry-Run Toggle -->
      <div class="toggle-card highlight-card">
        <div class="toggle-label">
          <span class="toggle-title">🧪 プレビューモード (テスト)</span>
          <span class="toggle-desc">実環境のタブを変更せず分類をテスト</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="chkPreviewMode">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <!-- Main Actions -->
    <div class="action-section">
      <button id="btnOrganize" class="btn-primary">
        <span class="btn-icon">✨</span>
        <span class="btn-text" id="lblOrganizeBtn">今すぐタブを一括整理</span>
      </button>

      <div class="quick-actions">
        <button id="btnUndo" class="btn-secondary" title="前回の整理結果を元に戻す">
          <span>↩️</span> 元に戻す
        </button>
        <button id="btnExcludeCurrent" class="btn-secondary" title="現在のタブのドメインを次回からグループ除外">
          <span>🚫</span> ドメイン除外
        </button>
      </div>
      <div class="quick-actions">
        <button id="btnRemoveDuplicates" class="btn-secondary" title="同じURLの重複タブを削除">
          <span>🧹</span> 重複整理
        </button>
        <button id="btnUngroup" class="btn-secondary" title="現在のグループ分けを解除">
          <span>🔓</span> グループ解除
        </button>
      </div>
    </div>

    <!-- Dashboard Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="statTabCount">0</span>
        <span class="stat-label">総タブ数</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statGroupCount">0</span>
        <span class="stat-label">アクティブグループ</span>
      </div>
    </div>

    <!-- Current Tab Groups List -->
    <div class="groups-section">
      <div class="section-header">
        <h2 id="listSectionTitle">現在のグループ一覧</h2>
        <span id="statusToast" class="status-toast"></span>
      </div>
      <div id="groupList" class="group-list">
        <div class="loading-spinner">読み込み中...</div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
