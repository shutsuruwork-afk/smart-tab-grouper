<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tab Grouper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="popupCard" class="popup-card">
    <section id="confirmationView" class="popup-view" aria-labelledby="confirmationTitle" aria-describedby="confirmationDescription">
      <div class="view-copy">
        <div class="view-heading">
          <h1 id="confirmationTitle">整理するタブを確認しています…</h1>
          <button class="settings-link" type="button" title="設定を開く" aria-label="設定を開く">
            <span>設定</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M7 4h9v9h-2V7.4l-8.3 8.3-1.4-1.4L12.6 6H7V4Z"/>
            </svg>
          </button>
        </div>
        <p id="confirmationDescription">現在のウィンドウだけを確認しています。</p>
      </div>

      <p id="confirmationStatus" class="status-message" role="status" aria-live="polite"></p>

      <div class="view-actions">
        <button id="btnCancel" class="button button-secondary" type="button">キャンセル</button>
        <button id="btnConfirm" class="button button-primary" type="button" disabled>整理</button>
      </div>
    </section>

    <section id="progressView" class="popup-view progress-view" aria-labelledby="progressTitle" hidden>
      <span class="progress-indicator" aria-hidden="true"></span>
      <div class="progress-copy">
        <h1 id="progressTitle">整理しています…</h1>
        <p id="progressDescription">このまま少しお待ちください。</p>
      </div>
    </section>

    <section id="completionView" class="popup-view completion-view" aria-labelledby="completionTitle" hidden>
      <div class="view-copy">
        <div class="view-heading">
          <div class="completion-heading-copy">
            <span class="completion-mark" aria-hidden="true">✓</span>
            <h1 id="completionTitle">整理しました</h1>
          </div>
          <button class="settings-link" type="button" title="設定を開く" aria-label="設定を開く">
            <span>設定</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M7 4h9v9h-2V7.4l-8.3 8.3-1.4-1.4L12.6 6H7V4Z"/>
            </svg>
          </button>
        </div>
        <p id="completionDescription"></p>
      </div>

      <div id="completionGroups" class="completion-groups" aria-label="整理したグループ"></div>
      <p id="completionStatus" class="status-message" role="status" aria-live="polite"></p>
      <div class="view-actions completion-actions">
        <button id="btnUndo" class="button button-secondary" type="button" title="ショートカット: Ctrl+Z / ⌘Z" aria-label="タブグループを元に戻す" aria-keyshortcuts="Control+Z Meta+Z">元に戻す</button>
        <button id="btnClose" class="button button-primary" type="button">閉じる</button>
      </div>
    </section>
  </main>

  <script src="../utils/theme.js"></script>
  <script src="../utils/tab_navigation.js"></script>
  <script src="../utils/keyboard_shortcuts.js"></script>
  <script src="../utils/menu_navigation.js"></script>
  <script src="../utils/action_reconciliation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
